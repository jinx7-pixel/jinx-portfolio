name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to main.
#
# There is no build step: the site is plain HTML, CSS, vanilla JavaScript and
# a vendored Tailwind runtime, all served from the repository root.
#
# The published URL is:
#   https://jinx7-pixel.github.io/jinx-portfolio/
#
# Note: the whole repository root is uploaded, so `.github/`, `README.md` and
# `.gitignore` are also present in the artifact. They are inert, but if that
# ever matters, move the site into a `public/` folder and point `path:` there.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow reads the repository, publishes an artifact,
# and writes the Pages deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# A new push supersedes an in-flight deployment instead of queueing behind it,
# so the live site never lags behind main by more than one deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
